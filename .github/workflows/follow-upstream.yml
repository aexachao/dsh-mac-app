name: Follow upstream runtime

# 捆绑运行时把"版本漂移"换成了"我们负责跟随"。没有这个定时检查，锁文件会一直停在
# 发版那天的版本上，而用户装的正是我们捆的那份——他们再也不会自动拿到 dsh 的更新。
on:
  schedule:
    # 每天 04:17 UTC（约北京时间 12:17）。错开整点，避开 GitHub 定时任务的高峰排队。
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    name: Check npm and nodejs.org
    # 只用到 curl + python3，不需要 macOS runner（macOS 分钟数贵 10 倍）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update runtime-pins.json
        id: check
        run: |
          ./scripts/check-upstream.sh
          if git diff --quiet runtime-pins.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # diff 走文件而不是 step output：output 要拼进下一步的脚本文本里，
            # 而这里的内容来自 git，不该有机会参与脚本解析。
            git diff --unified=0 runtime-pins.json > /tmp/pins.diff
            NODE=$(python3 -c "import json;print(json.load(open('runtime-pins.json'))['node']['version'])")
            DSH=$(python3 -c "import json;print(json.load(open('runtime-pins.json'))['dsh']['version'])")
            echo "branch=chore/runtime-pins-dsh${DSH}-node${NODE}" >> "$GITHUB_OUTPUT"
            echo "summary=dsh ${DSH} / node ${NODE}" >> "$GITHUB_OUTPUT"
          fi

      # 分支名带版本号，所以同一组版本重复跑不会开第二个 PR；已存在就直接退出。
      - name: Open pull request
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.check.outputs.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "$BRANCH 已存在，跳过"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -q -am "chore: 运行时锁跟随上游（${{ steps.check.outputs.summary }}）"
          git push -q -u origin "$BRANCH"
          {
            echo '自动跟随上游版本。**合并前必须人工验证**——锁文件一变就等于换运行时。'
            echo
            echo '```diff'
            cat /tmp/pins.diff
            echo '```'
            echo
            echo '验证清单：'
            echo
            echo '- [ ] `BUNDLE_RUNTIME=1 ARCHS=arm64 NO_INSTALL=1 ./scripts/build.sh` 成功（校验和对得上）'
            echo '- [ ] 装出来的 .app 能起到 dsh 页面，插件正常加载'
            echo '- [ ] 若跨了 node 大版本：`node-pty` / `sharp` / `koffi` 的原生模块仍能加载'
            echo '      （ABI 按 NODE_MODULE_VERSION 编译，跨大版本是移植而不是升级）'
            echo '- [ ] `CHANGELOG.md` 里记一句运行时版本变化'
          } > /tmp/pr-body.md
          gh pr create --base main --head "$BRANCH" \
            --title "chore: 运行时锁跟随上游（${{ steps.check.outputs.summary }}）" \
            --body-file /tmp/pr-body.md
