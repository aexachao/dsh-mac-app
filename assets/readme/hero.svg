<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">Harness — DeepSeek Harness（dsh）工作台的 macOS 原生应用</title>
  <desc id="desc">深色标题板：应用名与「打开即启动服务、退出即停止」的说明，右侧是服务状态机的三个状态（starting / running / failed）与退出时连子孙进程一并终止。</desc>

  <!-- 背景 -->
  <rect width="1200" height="420" rx="26" fill="#0f1115"/>

  <!-- 窗口条：这就是应用本体的样子（隐藏标题栏、深色背景） -->
  <g id="window-bar">
    <circle cx="34" cy="34" r="6" fill="#ff5f57"/>
    <circle cx="56" cy="34" r="6" fill="#febc2e"/>
    <circle cx="78" cy="34" r="6" fill="#28c840"/>
    <text x="104" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="19" fill="#a6adb8">Harness</text>
    <circle cx="978" cy="34" r="6" fill="#30d158"/>
    <text x="996" y="40" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8b919a">127.0.0.1:3080</text>
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#1c1f26" stroke-width="1"/>
  </g>

  <!-- 标题区 -->
  <g id="title-block">
    <text x="64" y="116" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" fill="#8b919a">macOS 原生应用 · DeepSeek Harness (dsh)</text>
    <text x="62" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="76" font-weight="700" fill="#e8eaed">Harness</text>
    <text x="64" y="242" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="26" fill="#c3c9d1">打开即启动服务，退出即停止</text>
    <text x="64" y="278" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="20" fill="#8b919a">Node.js 与 dsh 已捆绑在应用里，下载即用</text>

    <!-- 快捷键：应用真正提供的三个入口 -->
    <g id="shortcuts" transform="translate(64 306)">
      <rect x="0" y="0" width="176" height="40" rx="20" fill="#171a21" stroke="#2a2d36"/>
      <text x="20" y="27" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" fill="#c3c9d1">⌘⇧L 日志</text>
      <rect x="192" y="0" width="212" height="40" rx="20" fill="#171a21" stroke="#2a2d36"/>
      <text x="212" y="27" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" fill="#c3c9d1">⌘⇧R 重启服务</text>
      <rect x="416" y="0" width="194" height="40" rx="20" fill="#171a21" stroke="#2a2d36"/>
      <text x="436" y="27" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" fill="#c3c9d1">⌘⇧O 浏览器</text>
    </g>
  </g>

  <!-- 右侧：真实的服务状态机（ServerState 的三个状态） -->
  <g id="service-state">
    <rect x="700" y="92" width="436" height="252" rx="14" fill="#12151a" stroke="#232733"/>
    <text x="728" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="19" fill="#8b919a">服务状态机</text>

    <!-- 状态轨道 -->
    <line x1="736" y1="164" x2="736" y2="264" stroke="#2a2d36" stroke-width="2"/>

    <circle cx="736" cy="164" r="6" fill="#febc2e"/>
    <text x="760" y="171" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" fill="#c3c9d1">starting</text>
    <text x="880" y="171" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="19" fill="#8b919a">先探可绑定的端口</text>

    <circle cx="736" cy="214" r="6" fill="#30d158"/>
    <text x="760" y="221" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" fill="#c3c9d1">running</text>
    <text x="880" y="221" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="19" fill="#8b919a">窗口就是那个页面</text>

    <circle cx="736" cy="264" r="6" fill="#4d6bfe"/>
    <text x="760" y="271" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" fill="#c3c9d1">failed</text>
    <text x="880" y="271" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="19" fill="#8b919a">分类给出下一步</text>

    <line x1="728" y1="296" x2="1108" y2="296" stroke="#1c1f26" stroke-width="1"/>
    <text x="728" y="324" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" fill="#6b7280">退出：连插件派生的子孙进程一并终止</text>
  </g>

  <!-- 元数据 -->
  <text x="64" y="392" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#5c6470">macOS 14+ · Apple Silicon / Intel 分别出包 · SwiftUI + WKWebView · AGPL-3.0</text>
</svg>
